name: CI

on:
  push:
    branches: [main, dev, feature/*, hotfix/*]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Host-based lint, type-check, and test across OS matrix
  # Note: Using ubuntu-latest (Debian-based) for Linux testing. GitHub Actions
  # does not provide rhel-latest as a standard runner. For RHEL-specific
  # testing, consider self-hosted runners or container-based approaches.
  # ============================================================================
  test-matrix:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false  # Continue running other jobs even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github
        continue-on-error: true  # TODO: Set to false once linting is clean
      
      - name: Format check with Ruff
        run: |
          ruff format --check .
        continue-on-error: true  # TODO: Set to false once formatting is clean
      
      - name: Type check with mypy
        run: |
          mypy .
        continue-on-error: true  # TODO: Set to false once type checking is clean
      
      - name: Type check with Pyright
        run: |
          pyright
        continue-on-error: true  # TODO: Set to false once type checking is clean
      
      - name: Run tests with pytest
        run: |
          pytest -v --tb=short --color=yes
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .pytest_cache
            debug.log
          retention-days: 7

  # ============================================================================
  # Container build and test (Linux only)
  # ============================================================================
  container-build:
    name: Container Build & Test (Linux)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: llm-assistant:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      - name: Test container starts successfully
        run: |
          # Start container in background
          docker run -d --name test-container \
            -p 7860:7860 \
            -e MEMORY__ENABLED=true \
            -e MEMORY__BACKEND=in_memory \
            llm-assistant:ci-test
          
          # Wait for container to be healthy (max 30 seconds)
          echo "Waiting for container to start..."
          for i in {1..30}; do
            if docker logs test-container 2>&1 | grep -q "Running on"; then
              echo "Container started successfully!"
              docker logs test-container
              exit 0
            fi
            sleep 1
          done
          
          echo "Container failed to start within 30 seconds"
          docker logs test-container
          exit 1
      
      - name: Stop and remove test container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
      
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: |
            docker logs test-container
          retention-days: 7

  # ============================================================================
  # Summary job - required for branch protection
  # ============================================================================
  ci-success:
    name: CI Success
    needs: [test-matrix, container-build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "❌ Test matrix failed"
            exit 1
          fi
          
          if [ "${{ needs.container-build.result }}" != "success" ]; then
            echo "❌ Container build failed"
            exit 1
          fi
          
          echo "✅ All CI checks passed!"

