name: CI

on:
  push:
    branches: [main, dev, feature/*, hotfix/*]
    tags:
      - 'v*.*.*'  # Trigger on version tags (e.g., v0.5.0, v1.0.0)
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Host-based lint, type-check, and test across OS matrix
  # Note: Using ubuntu-latest (Debian-based) for Linux testing. GitHub Actions
  # does not provide rhel-latest as a standard runner. For RHEL-specific
  # testing, consider self-hosted runners or container-based approaches.
  # ============================================================================
  test-matrix:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false  # Continue running other jobs even if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github
        continue-on-error: true  # TODO: Set to false once linting is clean
      
      - name: Format check with Ruff
        run: |
          ruff format --check .
        continue-on-error: true  # TODO: Set to false once formatting is clean
      
      - name: Type check with mypy
        run: |
          mypy .
        continue-on-error: true  # TODO: Set to false once type checking is clean
      
      - name: Type check with Pyright
        run: |
          pyright
        continue-on-error: true  # TODO: Set to false once type checking is clean
      
      - name: Run tests with pytest
        run: |
          pytest -v --tb=short --color=yes
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            .pytest_cache
            debug.log
          retention-days: 7

  # ============================================================================
  # Container build and test (Linux only)
  # ============================================================================
  container-build:
    name: Container Build & Test (Linux)
    runs-on: ubuntu-latest
    
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          
          echo "Disk space after cleanup:"
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: false
          tags: llm-assistant:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
      
      - name: Test container starts successfully
        run: |
          # Start container in background
          docker run -d --name test-container \
            -p 7860:7860 \
            -e MEMORY__ENABLED=true \
            -e MEMORY__BACKEND=in_memory \
            llm-assistant:ci-test
          
          # Wait for container to be healthy (max 30 seconds)
          echo "Waiting for container to start..."
          for i in {1..30}; do
            if docker logs test-container 2>&1 | grep -q "Running on"; then
              echo "Container started successfully!"
              docker logs test-container
              exit 0
            fi
            sleep 1
          done
          
          echo "Container failed to start within 30 seconds"
          docker logs test-container
          exit 1
      
      - name: Stop and remove test container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true
      
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs
          path: |
            docker logs test-container
          retention-days: 7

  # ============================================================================
  # Container image publishing to GHCR (main branch and tags only)
  # ============================================================================
  publish-container:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [test-matrix, container-build]
    # Only publish on push to main branch or version tags
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          
          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          
          echo "Disk space after cleanup:"
          df -h
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Set 'latest' tag for main branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Generate semver tags from git tags (v1.0.0 -> 1.0.0, 1.0, 1)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Use git sha as tag for traceability
            type=sha,prefix={{branch}}-,format=short
      
      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Output published image info
        run: |
          echo "## 📦 Published Container Image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** GitHub Container Registry (GHCR)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Summary job - required for branch protection
  # ============================================================================
  ci-success:
    name: CI Success
    needs: [test-matrix, container-build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "❌ Test matrix failed"
            exit 1
          fi
          
          if [ "${{ needs.container-build.result }}" != "success" ]; then
            echo "❌ Container build failed"
            exit 1
          fi
          
          echo "✅ All CI checks passed!"

